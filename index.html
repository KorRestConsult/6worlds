<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111"><title>Restaurant Academy — Demo</title><style>
:root{--bg:#f4f3ef;--paper:#fff;--ink:#151515;--muted:#74736e;--line:#e5e3dd;--soft:#eceae4;--ok:#e4f3e8;--warn:#fff0cf;--r:22px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit;color:inherit;cursor:pointer}.shell{max-width:980px;margin:auto;min-height:100vh;padding-bottom:94px}.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#f4f3efd9;backdrop-filter:blur(18px);border-bottom:1px solid #0000000a}.brand{border:0;background:none;display:flex;gap:10px;align-items:center;text-align:left}.mark{width:42px;height:42px;border-radius:14px;background:#151515;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:900}.brand b{font-size:14px}.brand small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.actions{display:flex;gap:7px;align-items:center}.pill,.avatar{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-size:10px;font-weight:800}.avatar{width:38px;height:38px;padding:0;background:#ddd8cd}main{padding:18px}.hero{display:grid;grid-template-columns:1.4fr .6fr;gap:20px;background:#151515;color:#fff;padding:28px;border-radius:30px;overflow:hidden}.kicker{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#999}.hero h1{font-size:34px;line-height:1.03;letter-spacing:-.04em;margin:8px 0}.hero p{color:#c8c8c8;font-size:12px;line-height:1.5;max-width:560px}.level{border:1px solid #ffffff22;background:#ffffff0d;border-radius:20px;padding:18px;align-self:end}.level b{display:block;font-size:30px}.level span{font-size:10px;color:#aaa}.track{height:7px;background:var(--soft);border-radius:99px;overflow:hidden}.track>i{display:block;height:100%;background:#151515;border-radius:inherit}.level .track{background:#ffffff20;margin:12px 0}.level .track>i{background:#fff}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.primary,.secondary{border-radius:13px;padding:11px 14px;font-size:10px;font-weight:850}.primary{background:#151515;color:#fff;border:1px solid #151515}.hero .primary{background:#fff;color:#151515;border-color:#fff}.secondary{background:#fff;border:1px solid var(--line)}.hero .secondary{background:transparent;color:#fff;border-color:#555}.section{margin-top:22px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:11px;gap:12px}.head h2{margin:0;font-size:20px;letter-spacing:-.025em}.head p{margin:3px 0 0;color:var(--muted);font-size:10px}.grid{display:grid;gap:12px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:17px}.metric b{font-size:27px;display:block}.metric span{font-size:10px;color:var(--muted)}.delta{display:inline-block;margin-top:9px;padding:4px 7px;border-radius:999px;background:var(--ok);color:#315f3b;font-size:8px;font-weight:800}.course h3{margin:12px 0 4px;font-size:17px}.course p{margin:0 0 15px;color:var(--muted);font-size:10px;line-height:1.45}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:9px;margin:7px 0}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-size:9px;font-weight:800}.chip.on{background:#151515;color:#fff}.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.dish{border:1px solid var(--line);background:#fff;border-radius:19px;text-align:left;padding:0;overflow:hidden}.art{height:100px;background:linear-gradient(135deg,#eae5da,#d8d0c3);padding:13px;display:flex;align-items:flex-end}.art span{background:#fffffff0;border-radius:999px;padding:5px 8px;font-size:8px;font-weight:850}.dishbody{padding:13px}.dish h3{font-size:14px;margin:0 0 4px}.dish p{font-size:9px;line-height:1.4;color:var(--muted);margin:0}.quiz{max-width:680px;margin:auto}.question{font-size:24px;line-height:1.2;margin:13px 0 18px}.answers{display:grid;gap:8px}.answer{border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px;text-align:left;font-size:11px;font-weight:700}.answer.good{background:var(--ok);border-color:#b7d8bf}.answer.bad{background:#f8e5e2;border-color:#dfb7b0}.feedback{margin-top:12px;background:var(--soft);padding:11px;border-radius:13px;font-size:10px;line-height:1.4}.leaders{display:grid;gap:8px}.person{display:grid;grid-template-columns:30px 38px 1fr auto;align-items:center;gap:9px;border:1px solid var(--line);background:#fff;padding:11px;border-radius:15px}.num{color:var(--muted);font-size:11px;font-weight:850}.pa{width:36px;height:36px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:9px;font-weight:850}.person b{font-size:11px}.person small{display:block;color:var(--muted);font-size:8px;margin-top:2px}.xp{font-size:10px;font-weight:900}.rating{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(260px,.55fr);gap:14px;align-items:start}.board{background:#fff;border:1px solid var(--line);border-radius:22px;padding:14px}.side{display:grid;gap:12px}.rankhero{background:#151515;color:#fff;border-radius:26px;padding:21px;min-height:180px;display:flex;flex-direction:column;justify-content:space-between}.rankhero strong{font-size:54px;line-height:.95;display:block;margin:8px 0}.rankhero p{font-size:10px;color:#bbb;margin:0}.mini{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px}.mini b{display:block;font-size:12px;margin-bottom:5px}.mini p{font-size:9px;line-height:1.45;color:var(--muted);margin:0}.manager{background:#e9e6df;border:1px solid var(--line);border-radius:28px;padding:25px}.manager h1{font-size:31px;margin:7px 0;letter-spacing:-.035em}.manager p{font-size:11px;color:#666;line-height:1.5;max-width:600px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 7px;border-bottom:1px solid var(--line);font-size:9px}th{color:var(--muted)}td b{font-size:10px}.status{display:inline-block;padding:4px 7px;border-radius:999px;background:var(--ok);font-size:8px;font-weight:850}.status.warn{background:var(--warn)}.insight{background:var(--soft);border-radius:15px;padding:13px;font-size:10px;line-height:1.45}.insight b{display:block;margin-bottom:3px}.nav{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 24px));display:grid;grid-template-columns:repeat(4,1fr);padding:7px;background:#151515f2;border-radius:22px}.nav button{border:0;background:none;color:#858585;border-radius:15px;padding:8px 4px;font-size:8px}.nav button b{display:block;font-size:15px;margin-bottom:2px}.nav button.on{background:#fff;color:#151515}dialog{width:min(600px,calc(100% - 24px));border:0;border-radius:24px;padding:0}dialog::backdrop{background:#0008;backdrop-filter:blur(3px)}.modal{padding:22px}.modal h2{font-size:26px;margin:5px 0}.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}.fact{background:var(--bg);border-radius:13px;padding:11px}.fact span{display:block;font-size:8px;color:var(--muted);text-transform:uppercase}.fact b{font-size:10px;line-height:1.4;display:block;margin-top:4px}.close{width:calc(100% - 44px);margin:0 22px 22px;padding:11px;border:0;border-radius:13px;background:#151515;color:#fff;font-size:10px;font-weight:850}

@media(min-width:1100px){.shell{max-width:1380px;padding-left:116px;padding-right:34px}.nav{left:24px;width:82px}.menu{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{grid-template-columns:1.45fr .55fr;padding:38px}.hero h1{font-size:45px}.card{padding:20px}}

@media(max-width:430px){.side{grid-template-columns:1fr}.rankhero{grid-column:auto}.person{grid-template-columns:26px 36px 1fr auto;padding:10px}.xp{font-size:9px}}
</style></head><body><div class="shell"><header class="top"><button class="brand" onclick="go('home')"><span class="mark">RA</span><span><b>Restaurant Academy</b><small>DEMO · обучение меню</small></span></button><div class="actions"><button class="pill" id="roleBtn" onclick="toggleRole()">Режим: Официант</button><button class="avatar">ИК</button></div></header><main id="app"></main><nav class="nav" id="nav"><button data-r="home" onclick="go('home')"><b>⌂</b>Главная</button><button data-r="learn" onclick="go('learn')"><b>▤</b>Учить</button><button data-r="quiz" onclick="go('quiz')"><b>✓</b>Тест</button><button data-r="rating" onclick="go('rating')"><b>★</b>Рейтинг</button></nav></div><dialog id="dlg"><div id="dlgBody"></div><button class="close" onclick="dlg.close()">Закрыть</button></dialog><script>
const MENU=[{id:'k1',type:'kitchen',cat:'Закуски',name:'Страчателла с томатами',desc:'Сливочная страчателла, томаты, базилик, масло.',taste:'Сливочный, свежий, лёгкая кислотность',all:'Молоко',pair:'Просекко / лёгкое белое',sell:'Если хочется лёгкую закуску — это самый понятный старт.',m:88},{id:'k2',type:'kitchen',cat:'Закуски',name:'Тартар из говядины',desc:'Говядина, каперсы, горчица, желток.',taste:'Мясной, пикантный, солоноватый',all:'Яйцо, горчица',pair:'Пино нуар / сухое красное',sell:'Для гостя, который любит яркий мясной вкус.',m:76},{id:'k3',type:'kitchen',cat:'Горячее',name:'Лосось и зелёные овощи',desc:'Лосось, брокколи, шпинат, лимонный соус.',taste:'Нежный, свежий, цитрусовый',all:'Рыба, молоко',pair:'Совиньон блан',sell:'Лёгкое горячее без тяжёлого гарнира.',m:72},{id:'k4',type:'kitchen',cat:'Паста',name:'Паппарделле с грибами',desc:'Паста, грибы, пармезан, сливочный соус.',taste:'Сливочный, умами, насыщенный',all:'Глютен, молоко',pair:'Шардоне',sell:'Хороший выбор, если хочется комфортной насыщенной пасты.',m:64},{id:'b1',type:'bar',cat:'Коктейли',name:'Negroni',desc:'Джин, красный вермут, биттер.',taste:'Горько-сладкий, плотный, цитрусовый',all:'—',pair:'Тартар / мясные закуски',sell:'Если любите сухие и горькие коктейли — берите его.',m:70},{id:'b2',type:'bar',cat:'Коктейли',name:'Aperol Spritz',desc:'Апероль, просекко, сода.',taste:'Лёгкий, цитрусовый, умеренно горький',all:'Сульфиты',pair:'Страчателла / лёгкие закуски',sell:'Простой аперитив перед едой.',m:81},{id:'b3',type:'bar',cat:'Вино',name:'Riesling trocken',desc:'Сухой рислинг с высокой кислотностью.',taste:'Цитрус, зелёное яблоко, минералы',all:'Сульфиты',pair:'Лосось / овощи',sell:'Если нужно очень свежее и не тяжёлое белое.',m:58},{id:'b4',type:'bar',cat:'Без алкоголя',name:'Эспрессо-тоник',desc:'Эспрессо, тоник, цитрус.',taste:'Горький, свежий, кофейный',all:'—',pair:'После еды',sell:'Освежает лучше обычного кофе и остаётся кофейным.',m:67}];
const QUIZ=[{q:'Гость просит лёгкое белое к лососю. Что предложить?',a:['Пино нуар','Совиньон блан','Negroni'],ok:1,why:'Совиньон блан поддержит свежесть рыбы и зелёных овощей.'},{q:'У гостя аллергия на молочные продукты. Где есть риск?',a:['Страчателла с томатами','Negroni','Эспрессо-тоник'],ok:0,why:'Страчателла — молочный сыр.'},{q:'Гость любит сухие и выраженно горькие коктейли.',a:['Aperol Spritz','Negroni','Riesling'],ok:1,why:'Negroni — самый сухой и горький вариант из списка.'},{q:'Что логичнее предложить к тартару?',a:['Пино нуар','Эспрессо-тоник','Сладкий лимонад'],ok:0,why:'Лёгкое сухое красное хорошо работает с сырым мясом и пикантностью.'},{q:'Гость хочет сытную комфортную пасту.',a:['Паппарделле с грибами','Страчателла','Лосось'],ok:0,why:'Паппарделле — самый насыщенный и сливочный вариант.'}];
const STAFF=[{name:'Анна Соколова',role:'Официант',k:94,b:89,xp:2860,status:'Эксперт'},{name:'Илья Коробицин',role:'Официант',k:78,b:71,xp:2140,status:'Уверенный'},{name:'Михаил Орлов',role:'Официант',k:83,b:62,xp:1980,status:'Уверенный'},{name:'Дарья Белова',role:'Официант',k:61,b:54,xp:1420,status:'В обучении'},{name:'Егор Фомин',role:'Стажёр',k:42,b:28,xp:720,status:'В обучении'}];
let state={route:'home',role:localStorage.getItem('ra_role')||'waiter',xp:+localStorage.getItem('ra_xp')||2140,filter:'all',qi:0,score:0,answered:false};const app=document.getElementById('app'),nav=document.getElementById('nav'),roleBtn=document.getElementById('roleBtn'),dlg=document.getElementById('dlg'),dlgBody=document.getElementById('dlgBody');function initials(n){return n.split(' ').map(x=>x[0]).slice(0,2).join('')}function go(r){state.route=r;render();scrollTo({top:0,behavior:'smooth'})}function toggleRole(){state.role=state.role==='waiter'?'manager':'waiter';localStorage.setItem('ra_role',state.role);state.route='home';render()}function sync(){roleBtn.textContent='Режим: '+(state.role==='waiter'?'Официант':'Управляющий');nav.style.display=state.role==='manager'?'none':'grid';document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.r===state.route))}function render(){sync();if(state.role==='manager')return manager();if(state.route==='learn')return learn();if(state.route==='quiz')return quiz();if(state.route==='rating')return rating();home()}
function home(){app.innerHTML=`<section class="hero"><div><div class="kicker">Сегодня · обучение меню</div><h1>Знай меню так, чтобы продавать уверенно.</h1><p>Не большая LMS. Короткая ежедневная тренировка кухни и бара: карточки, реальные вопросы гостя, тесты и рейтинг.</p><div class="row"><button class="primary" onclick="go('learn')">Учить меню</button><button class="secondary" onclick="go('quiz')">Быстрый тест</button></div></div><div class="level"><span>Ваш уровень</span><b>Уверенный</b><div class="track"><i style="width:68%"></i></div><span>${state.xp} XP · серия 4 дня</span></div></section><section class="section"><div class="head"><div><h2>Что сотрудник реально знает</h2><p>Кухня, бар и место в смене — одним взглядом.</p></div></div><div class="grid g3"><div class="card metric"><b>78%</b><span>Кухня</span><div class="delta">+6% за неделю</div></div><div class="card metric"><b>71%</b><span>Бар</span><div class="delta">+9% за неделю</div></div><div class="card metric"><b>#2</b><span>Рейтинг смены</span><div class="delta">из 5 сотрудников</div></div></div></section><section class="section"><div class="head"><div><h2>Два главных блока</h2><p>Первый продаваемый продукт специально узкий.</p></div></div><div class="grid g2"><div class="card course"><h3>Меню кухни</h3><p>Состав, вкус, аллергены, подача, пары и фразы для продажи.</p><div class="meta"><span>Освоение</span><b>78%</b></div><div class="track"><i style="width:78%"></i></div><div class="row"><button class="secondary" onclick="state.filter='kitchen';go('learn')">Открыть кухню</button></div></div><div class="card course"><h3>Меню бара</h3><p>Коктейли, вино, безалкогольные позиции и сочетания с кухней.</p><div class="meta"><span>Освоение</span><b>71%</b></div><div class="track"><i style="width:71%"></i></div><div class="row"><button class="secondary" onclick="state.filter='bar';go('learn')">Открыть бар</button></div></div></div></section>`}
function learn(){let list=MENU.filter(x=>state.filter==='all'||x.type===state.filter);app.innerHTML=`<section><div class="kicker">База меню</div><div class="head"><div><h2 style="font-size:29px">Учить позиции</h2><p>На телефоне — по одной карточке; на iPad — рабочая сетка без пустоты.</p></div></div><div class="filters"><button class="chip ${state.filter==='all'?'on':''}" onclick="state.filter='all';learn()">Все</button><button class="chip ${state.filter==='kitchen'?'on':''}" onclick="state.filter='kitchen';learn()">Кухня</button><button class="chip ${state.filter==='bar'?'on':''}" onclick="state.filter='bar';learn()">Бар</button></div><div class="menu">${list.map(x=>`<button class="dish" onclick="openDish('${x.id}')"><div class="art"><span>${x.type==='kitchen'?'КУХНЯ':'БАР'} · ${x.cat}</span></div><div class="dishbody"><h3>${x.name}</h3><p>${x.desc}</p><div class="meta"><span>Знание позиции</span><b>${x.m}%</b></div><div class="track"><i style="width:${x.m}%"></i></div></div></button>`).join('')}</div></section>`}function openDish(id){let x=MENU.find(y=>y.id===id);dlgBody.innerHTML=`<div class="modal"><div class="kicker">${x.type==='kitchen'?'Меню кухни':'Меню бара'} · ${x.cat}</div><h2>${x.name}</h2><p>${x.desc}</p><div class="facts"><div class="fact"><span>Вкус</span><b>${x.taste}</b></div><div class="fact"><span>Аллергены</span><b>${x.all}</b></div><div class="fact"><span>Что предложить</span><b>${x.pair}</b></div><div class="fact"><span>Как продать</span><b>${x.sell}</b></div></div></div>`;dlg.showModal()}
function quiz(){if(state.qi>=5)return quizResult();let q=QUIZ[state.qi];app.innerHTML=`<section class="quiz"><div class="kicker">Проверка знаний · ${state.qi+1}/5</div><div class="card"><div class="question">${q.q}</div><div class="answers">${q.a.map((a,i)=>`<button class="answer" id="a${i}" onclick="answer(${i})">${a}</button>`).join('')}</div><div id="fb"></div></div></section>`}function answer(i){if(state.answered)return;state.answered=true;let q=QUIZ[state.qi];document.querySelectorAll('.answer').forEach((b,j)=>{if(j===q.ok)b.classList.add('good');else if(j===i)b.classList.add('bad');b.disabled=true});if(i===q.ok)state.score++;document.getElementById('fb').innerHTML=`<div class="feedback"><b>${i===q.ok?'Верно.':'Нужно закрепить.'}</b><br>${q.why}<div class="row"><button class="primary" onclick="state.qi++;state.answered=false;quiz()">Дальше</button></div></div>`}function quizResult(){let gain=state.score*80;state.xp+=gain;localStorage.setItem('ra_xp',state.xp);app.innerHTML=`<section class="quiz"><div class="card" style="text-align:center;padding:38px"><div class="kicker">Тест завершён</div><h2 style="font-size:34px;margin:8px 0">${state.score}/5</h2><p style="color:var(--muted);font-size:11px">Рейтинг растёт только после подтверждённых знаний.</p><div class="delta">+${gain} XP</div><div class="row" style="justify-content:center"><button class="primary" onclick="state.qi=0;state.score=0;state.answered=false;quiz()">Ещё тест</button><button class="secondary" onclick="go('rating')">Рейтинг</button></div></div></section>`}
function rating(){let people=STAFF.map(x=>x.name.startsWith('Илья')?{...x,xp:state.xp}:x).sort((a,b)=>b.xp-a.xp),pos=people.findIndex(x=>x.name.startsWith('Илья'))+1,ahead=pos>1?Math.max(0,people[pos-2].xp-state.xp):0;app.innerHTML=`<section><div class="kicker">Игровая мотивация</div><div class="head"><div><h2 style="font-size:29px">Рейтинг команды</h2><p>Это не украшение: он показывает, кто реально знает продукт.</p></div></div><div class="rating"><div class="board"><div class="leaders">${people.map((p,i)=>`<div class="person"><div class="num">${i+1}</div><div class="pa">${initials(p.name)}</div><div><b>${p.name}</b><small>${p.role} · ${p.status}</small></div><div class="xp">${p.xp} XP</div></div>`).join('')}</div></div><aside class="side"><div class="rankhero"><div><div class="kicker">Ваш результат</div><strong>#${pos}</strong><p>${state.xp} XP · серия 4 дня</p></div><div class="track" style="background:#ffffff20"><i style="width:${pos===1?100:70}%;background:#fff"></i></div></div><div class="mini"><b>${pos===1?'Вы лидер смены':`До места выше — ${ahead} XP`}</b><p>Один хороший тест или несколько слабых карточек могут закрыть разрыв.</p></div><div class="mini"><b>Зачем это владельцу</b><p>Он видит не «сотрудник открыл приложение», а измеримый уровень знания кухни и бара.</p></div></aside></div></section>`}
function manager(){let ak=Math.round(STAFF.reduce((s,x)=>s+x.k,0)/STAFF.length),ab=Math.round(STAFF.reduce((s,x)=>s+x.b,0)/STAFF.length);app.innerHTML=`<section class="manager"><div class="kicker">Кабинет управляющего</div><h1>Кто действительно знает меню?</h1><p>Управляющий видит готовность команды к смене, слабые разделы и конкретных сотрудников, которых надо доучить.</p><div class="row"><button class="primary" onclick="toggleRole()">Посмотреть глазами официанта</button></div></section><section class="section"><div class="grid g3"><div class="card metric"><b>${ak}%</b><span>Кухня команды</span></div><div class="card metric"><b>${ab}%</b><span>Бар команды</span></div><div class="card metric"><b>2</b><span>Требуют внимания</span></div></div></section><section class="section"><div class="card" style="overflow:auto"><table class="manager-table"><thead><tr><th>Сотрудник</th><th>Кухня</th><th>Бар</th><th>XP</th><th>Статус</th></tr></thead><tbody>${STAFF.map(p=>`<tr><td><b>${p.name}</b><br><span style="color:var(--muted)">${p.role}</span></td><td>${p.k}%</td><td>${p.b}%</td><td>${p.xp}</td><td><span class="status ${p.k<70||p.b<60?'warn':''}">${p.status}</span></td></tr>`).join('')}</tbody></table></div></section><section class="section"><div class="grid g2"><div class="insight"><b>Бар слабее кухни</b>Средний результат по бару ${ab}%. Повторить вина и коктейли.</div><div class="insight"><b>Егор Фомин — зона риска</b>28% по бару. До самостоятельной смены нужен повторный тест.</div></div></section>`}render();
</script></body></html>
