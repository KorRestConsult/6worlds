<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Restaurant Academy — Demo</title>
<style>
:root{--bg:#f4f3ef;--paper:#fff;--ink:#151515;--muted:#74736e;--line:#e5e3dd;--soft:#eceae4;--ok:#e4f3e8;--warn:#fff0cf;--r:22px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button{font:inherit;color:inherit;cursor:pointer}.shell{max-width:980px;margin:auto;padding-bottom:92px}.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#f4f3efd9;backdrop-filter:blur(18px);border-bottom:1px solid #0000000a}.brand{border:0;background:none;display:flex;gap:10px;align-items:center;text-align:left}.mark{width:42px;height:42px;border-radius:14px;background:#151515;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:900}.brand b{font-size:14px}.brand small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.actions{display:flex;gap:7px}.pill,.avatar{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-size:10px;font-weight:800}.avatar{width:38px;height:38px;padding:0;background:#ddd8cd}main{padding:18px}.hero{display:grid;grid-template-columns:1.4fr .6fr;gap:20px;background:#151515;color:#fff;padding:28px;border-radius:30px;overflow:hidden}.kicker{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#999}.hero h1{font-size:34px;line-height:1.03;letter-spacing:-.04em;margin:8px 0}.hero p{color:#c8c8c8;font-size:12px;line-height:1.5;max-width:560px}.level{border:1px solid #ffffff22;background:#ffffff0d;border-radius:20px;padding:18px;align-self:end}.level b{display:block;font-size:30px}.level span{font-size:10px;color:#aaa}.track{height:7px;background:var(--soft);border-radius:99px;overflow:hidden}.track>i{display:block;height:100%;background:#151515;border-radius:inherit}.level .track{background:#ffffff20;margin:12px 0}.level .track>i{background:#fff}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.primary,.secondary{border-radius:13px;padding:11px 14px;font-size:10px;font-weight:850}.primary{background:#151515;color:#fff;border:1px solid #151515}.hero .primary{background:#fff;color:#151515;border-color:#fff}.secondary{background:#fff;border:1px solid var(--line)}.hero .secondary{background:transparent;color:#fff;border-color:#555}.section{margin-top:22px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:11px;gap:12px}.head h2{margin:0;font-size:20px;letter-spacing:-.025em}.head p{margin:3px 0 0;color:var(--muted);font-size:10px}.grid{display:grid;gap:12px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:17px}.metric b{font-size:27px;display:block}.metric span{font-size:10px;color:var(--muted)}.delta{display:inline-block;margin-top:9px;padding:4px 7px;border-radius:999px;background:var(--ok);color:#315f3b;font-size:8px;font-weight:800}.course h3{margin:12px 0 4px;font-size:17px}.course p{margin:0 0 15px;color:var(--muted);font-size:10px;line-height:1.45}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:9px;margin:7px 0}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-size:9px;font-weight:800}.chip.on{background:#151515;color:#fff}.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.dish{border:1px solid var(--line);background:#fff;border-radius:19px;text-align:left;padding:0;overflow:hidden}.art{height:92px;background:linear-gradient(135deg,#eae5da,#d8d0c3);padding:13px;display:flex;align-items:flex-end}.art span{background:#fffffff0;border-radius:999px;padding:5px 8px;font-size:8px;font-weight:850}.dishbody{padding:13px}.dish h3{font-size:14px;margin:0 0 4px}.dish p{font-size:9px;line-height:1.4;color:var(--muted);margin:0}.quiz{max-width:680px;margin:auto}.question{font-size:24px;line-height:1.2;margin:13px 0 18px}.answers{display:grid;gap:8px}.answer{border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px;text-align:left;font-size:11px;font-weight:700}.answer.good{background:var(--ok);border-color:#b7d8bf}.answer.bad{background:#f8e5e2;border-color:#dfb7b0}.feedback{margin-top:12px;background:var(--soft);padding:11px;border-radius:13px;font-size:10px;line-height:1.4}.leaders{display:grid;gap:8px}.person{display:grid;grid-template-columns:30px 38px 1fr auto;align-items:center;gap:9px;border:1px solid var(--line);background:#fff;padding:11px;border-radius:15px}.num{color:var(--muted);font-size:11px;font-weight:850}.pa{width:36px;height:36px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:9px;font-weight:850}.person b{font-size:11px}.person small{display:block;color:var(--muted);font-size:8px;margin-top:2px}.xp{font-size:10px;font-weight:900}.manager{background:#e9e6df;border:1px solid var(--line);border-radius:28px;padding:25px}.manager h1{font-size:31px;margin:7px 0;letter-spacing:-.035em}.manager p{font-size:11px;color:#666;line-height:1.5;max-width:600px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 7px;border-bottom:1px solid var(--line);font-size:9px}th{color:var(--muted)}td b{font-size:10px}.status{display:inline-block;padding:4px 7px;border-radius:999px;background:var(--ok);font-size:8px;font-weight:850}.status.warn{background:var(--warn)}.insight{background:var(--soft);border-radius:15px;padding:13px;font-size:10px;line-height:1.45}.insight b{display:block;margin-bottom:3px}.nav{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 24px));display:grid;grid-template-columns:repeat(4,1fr);padding:7px;background:#151515f2;border-radius:22px}.nav button{border:0;background:none;color:#858585;border-radius:15px;padding:8px 4px;font-size:8px}.nav button b{display:block;font-size:15px;margin-bottom:2px}.nav button.on{background:#fff;color:#151515}dialog{width:min(600px,calc(100% - 24px));border:0;border-radius:24px;padding:0}dialog::backdrop{background:#0008;backdrop-filter:blur(3px)}.modal{padding:22px}.modal h2{font-size:26px;margin:5px 0}.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}.fact{background:var(--bg);border-radius:13px;padding:11px}.fact span{display:block;font-size:8px;color:var(--muted);text-transform:uppercase}.fact b{font-size:10px;line-height:1.4;display:block;margin-top:4px}.close{width:calc(100% - 44px);margin:0 22px 22px;padding:11px;border:0;border-radius:13px;background:#151515;color:#fff;font-size:10px;font-weight:850}@media(max-width:700px){main{padding:12px}.hero{grid-template-columns:1fr;padding:22px}.hero h1{font-size:29px}.g3{grid-template-columns:1fr 1fr}.g3 .card:last-child{grid-column:1/-1}.g2,.menu{grid-template-columns:1fr}.pill{display:none}.facts{grid-template-columns:1fr}.brand small{display:none}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><button class="brand" onclick="go('home')"><span class="mark">RA</span><span><b>Restaurant Academy</b><small>DEMO · обучение меню</small></span></button><div class="actions"><button class="pill" id="roleBtn" onclick="toggleRole()">Режим: Официант</button><button class="avatar">ИК</button></div></header>
<main id="app"></main>
<nav class="nav" id="nav"><button data-r="home" onclick="go('home')"><b>⌂</b>Главная</button><button data-r="learn" onclick="go('learn')"><b>▤</b>Учить</button><button data-r="quiz" onclick="go('quiz')"><b>✓</b>Тест</button><button data-r="rating" onclick="go('rating')"><b>★</b>Рейтинг</button></nav>
</div>
<dialog id="dlg"><div id="dlgBody"></div><button class="close" onclick="dlg.close()">Закрыть</button></dialog>
<script>
const MENU=[
{id:'k1',type:'kitchen',cat:'Закуски',name:'Страчателла с томатами',desc:'Сливочная страчателла, томаты, базилик, масло.',taste:'Сливочный, свежий, лёгкая кислотность',all:'Молоко',pair:'Просекко / лёгкое белое',sell:'Если хочется лёгкую закуску — это самый понятный старт.',m:88},
{id:'k2',type:'kitchen',cat:'Закуски',name:'Тартар из говядины',desc:'Говядина, каперсы, горчица, желток.',taste:'Мясной, пикантный, солоноватый',all:'Яйцо, горчица',pair:'Пино нуар / сухое красное',sell:'Для гостя, который любит яркий мясной вкус.',m:76},
{id:'k3',type:'kitchen',cat:'Горячее',name:'Лосось и зелёные овощи',desc:'Лосось, брокколи, шпинат, лимонный соус.',taste:'Нежный, свежий, цитрусовый',all:'Рыба, молоко',pair:'Совиньон блан',sell:'Лёгкое горячее без тяжёлого гарнира.',m:72},
{id:'k4',type:'kitchen',cat:'Паста',name:'Паппарделле с грибами',desc:'Паста, грибы, пармезан, сливочный соус.',taste:'Сливочный, умами, насыщенный',all:'Глютен, молоко',pair:'Шардоне',sell:'Хороший выбор, если хочется комфортной насыщенной пасты.',m:64},
{id:'b1',type:'bar',cat:'Коктейли',name:'Negroni',desc:'Джин, красный вермут, биттер.',taste:'Горько-сладкий, плотный, цитрусовый',all:'—',pair:'Тартар / мясные закуски',sell:'Если любите сухие и горькие коктейли — берите его.',m:70},
{id:'b2',type:'bar',cat:'Коктейли',name:'Aperol Spritz',desc:'Апероль, просекко, сода.',taste:'Лёгкий, цитрусовый, умеренно горький',all:'Сульфиты',pair:'Страчателла / лёгкие закуски',sell:'Простой аперитив перед едой.',m:81},
{id:'b3',type:'bar',cat:'Вино',name:'Riesling trocken',desc:'Сухой рислинг с высокой кислотностью.',taste:'Цитрус, зелёное яблоко, минералы',all:'Сульфиты',pair:'Лосось / овощи',sell:'Если нужно очень свежее и не тяжёлое белое.',m:58},
{id:'b4',type:'bar',cat:'Без алкоголя',name:'Эспрессо-тоник',desc:'Эспрессо, тоник, цитрус.',taste:'Горький, свежий, кофейный',all:'—',pair:'После еды',sell:'Освежает лучше обычного кофе и остаётся кофейным.',m:67}
];
const QUIZ=[
{q:'Гость просит лёгкое белое к лососю. Что предложить?',a:['Пино нуар','Совиньон блан','Negroni'],ok:1,why:'Совиньон блан поддержит свежесть рыбы и зелёных овощей.'},
{q:'У гостя аллергия на молочные продукты. Где есть риск?',a:['Страчателла с томатами','Negroni','Эспрессо-тоник'],ok:0,why:'Страчателла — молочный сыр.'},
{q:'Гость любит сухие и выраженно горькие коктейли.',a:['Aperol Spritz','Negroni','Riesling'],ok:1,why:'Negroni — самый сухой и горький вариант из списка.'},
{q:'Что логичнее предложить к тартару?',a:['Пино нуар','Эспрессо-тоник','Сладкий лимонад'],ok:0,why:'Лёгкое сухое красное хорошо работает с сырым мясом и пикантностью.'},
{q:'Гость хочет сытную комфортную пасту.',a:['Паппарделле с грибами','Страчателла','Лосось'],ok:0,why:'Паппарделле — самый насыщенный и сливочный вариант.'}
];
const STAFF=[['Мария Волкова',91,84,1670,'Уверенно'],['Илья Коробицин',82,69,1240,'Уверенно'],['Анна Соколова',74,63,980,'Практика'],['Максим Левин',62,49,710,'Повторить'],['Егор Фомин',51,28,440,'Повторить']];
let state={route:'home',role:localStorage.ra_role||'waiter',xp:+(localStorage.ra_xp||1240),filter:'all',qi:0,qs:0,answered:false};
const app=document.getElementById('app'),nav=document.getElementById('nav'),roleBtn=document.getElementById('roleBtn'),dlg=document.getElementById('dlg'),dlgBody=document.getElementById('dlgBody');
function go(r){state.route=r;render()} function toggleRole(){state.role=state.role==='waiter'?'manager':'waiter';localStorage.ra_role=state.role;render()} function pct(a,b){return Math.round(a/b*100)}
function render(){roleBtn.textContent='Режим: '+(state.role==='waiter'?'Официант':'Управляющий');nav.style.display=state.role==='manager'?'none':'grid';nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.r===state.route));if(state.role==='manager')return manager();if(state.route==='learn')learn();else if(state.route==='quiz')quiz();else if(state.route==='rating')rating();else home()}
function home(){app.innerHTML=`<section class="hero"><div><div class="kicker">Сегодня · обучение меню</div><h1>Знай меню так, чтобы продавать уверенно.</h1><p>Карточки кухни и бара, короткие тесты по реальным ситуациям и личный рейтинг.</p><div class="row"><button class="primary" onclick="go('learn')">Продолжить обучение</button><button class="secondary" onclick="go('quiz')">Быстрый тест</button></div></div><div class="level"><span>Ваш уровень</span><b>Уверенный</b><div class="track"><i style="width:62%"></i></div><span>${state.xp} XP · следующий уровень 1600 XP</span></div></section><section class="section"><div class="head"><div><h2>Прогресс</h2><p>Не “прошёл курс”, а насколько реально знает продукт.</p></div></div><div class="grid g3"><div class="card metric"><b>82%</b><span>Кухня</span><div class="delta">+6% за неделю</div></div><div class="card metric"><b>69%</b><span>Бар</span><div class="delta">+9% за неделю</div></div><div class="card metric"><b>#2</b><span>В рейтинге смены</span><div class="delta">из 5 сотрудников</div></div></div></section><section class="section"><div class="head"><div><h2>Учебные блоки</h2><p>Главное ядро MVP.</p></div></div><div class="grid g2"><div class="card course"><div class="kicker">КУХНЯ</div><h3>Меню кухни</h3><p>Состав, вкус, аллергены, пары и фразы для продажи.</p><div class="meta"><span>Освоение</span><b>82%</b></div><div class="track"><i style="width:82%"></i></div><div class="row"><button class="secondary" onclick="state.filter='kitchen';go('learn')">Открыть</button></div></div><div class="card course"><div class="kicker">БАР</div><h3>Меню бара</h3><p>Вино, коктейли, вкусовой профиль и рекомендации.</p><div class="meta"><span>Освоение</span><b>69%</b></div><div class="track"><i style="width:69%"></i></div><div class="row"><button class="secondary" onclick="state.filter='bar';go('learn')">Открыть</button></div></div></div></section>`}
function learn(){const list=MENU.filter(x=>state.filter==='all'||x.type===state.filter);app.innerHTML=`<section><div class="kicker">База меню</div><div class="head"><div><h2 style="font-size:29px">Учить позиции</h2><p>Карточка должна помогать ответить гостю и продать, а не пересказать техкарту.</p></div></div><div class="filters"><button class="chip ${state.filter==='all'?'on':''}" onclick="f('all')">Все</button><button class="chip ${state.filter==='kitchen'?'on':''}" onclick="f('kitchen')">Кухня</button><button class="chip ${state.filter==='bar'?'on':''}" onclick="f('bar')">Бар</button></div><div class="menu">${list.map(x=>`<button class="dish" onclick="openDish('${x.id}')"><div class="art"><span>${x.type==='kitchen'?'КУХНЯ':'БАР'} · ${x.cat}</span></div><div class="dishbody"><h3>${x.name}</h3><p>${x.desc}</p><div class="meta"><span>Знание позиции</span><b>${x.m}%</b></div><div class="track"><i style="width:${x.m}%"></i></div></div></button>`).join('')}</div></section>`} function f(v){state.filter=v;learn()}
function openDish(id){const x=MENU.find(v=>v.id===id);dlgBody.innerHTML=`<div class="modal"><div class="kicker">${x.type==='kitchen'?'Кухня':'Бар'} · ${x.cat}</div><h2>${x.name}</h2><p style="color:var(--muted);font-size:11px;line-height:1.5">${x.desc}</p><div class="facts"><div class="fact"><span>Вкус</span><b>${x.taste}</b></div><div class="fact"><span>Аллергены</span><b>${x.all}</b></div><div class="fact"><span>Что предложить</span><b>${x.pair}</b></div><div class="fact"><span>Как продать</span><b>${x.sell}</b></div></div><div class="row"><button class="primary" onclick="learned('${x.id}')">Я выучил · +40 XP</button></div></div>`;dlg.showModal()} function learned(id){if(!localStorage['ra_'+id]){state.xp+=40;localStorage.ra_xp=state.xp;localStorage['ra_'+id]=1}dlg.close();render()}
function quiz(){if(state.qi>=QUIZ.length)return result();const q=QUIZ[state.qi];app.innerHTML=`<section class="quiz"><div class="kicker">Проверка знаний · ${state.qi+1}/${QUIZ.length}</div><div class="card" style="margin-top:10px"><div class="question">${q.q}</div><div class="answers">${q.a.map((a,i)=>`<button class="answer" id="a${i}" onclick="ans(${i})">${a}</button>`).join('')}</div><div id="fb"></div></div></section>`} function ans(i){if(state.answered)return;state.answered=true;const q=QUIZ[state.qi];document.querySelectorAll('.answer').forEach((b,j)=>{b.disabled=true;if(j===q.ok)b.classList.add('good');else if(j===i)b.classList.add('bad')});if(i===q.ok)state.qs++;document.getElementById('fb').innerHTML=`<div class="feedback"><b>${i===q.ok?'Верно.':'Нужно закрепить.'}</b><br>${q.why}<div class="row"><button class="primary" onclick="next()">Дальше</button></div></div>`} function next(){state.qi++;state.answered=false;quiz()} function result(){const add=state.qs*80;state.xp+=add;localStorage.ra_xp=state.xp;app.innerHTML=`<section class="quiz"><div class="card" style="text-align:center;padding:34px"><div style="width:110px;height:110px;border-radius:50%;background:#151515;color:#fff;display:grid;place-items:center;margin:auto;font-size:28px;font-weight:900">${state.qs}/5</div><h2>${state.qs>=4?'Меню знаешь уверенно.':'Есть что закрепить.'}</h2><p style="color:var(--muted);font-size:11px">За тест начисляются очки только за подтверждённые знания.</p><b style="display:inline-block;background:var(--ok);padding:8px 12px;border-radius:999px">+${add} XP</b><div class="row" style="justify-content:center"><button class="primary" onclick="restart()">Ещё раз</button><button class="secondary" onclick="go('rating')">Рейтинг</button></div></div></section>`} function restart(){state.qi=0;state.qs=0;state.answered=false;render()}
function rating(){const p=STAFF.map(x=>x[0].startsWith('Илья')?[x[0],x[1],x[2],state.xp,x[4]]:x).sort((a,b)=>b[3]-a[3]);app.innerHTML=`<section><div class="kicker">Игровая мотивация</div><div class="head"><div><h2 style="font-size:29px">Рейтинг команды</h2><p>Очки за обучение и подтверждённые знания, не за клики.</p></div></div><div class="leaders">${p.map((x,i)=>`<div class="person"><div class="num">${i+1}</div><div class="pa">${x[0].split(' ').map(v=>v[0]).join('')}</div><div><b>${x[0]}</b><small>${x[4]}</small></div><div class="xp">${x[3]} XP</div></div>`).join('')}</div></section>`}
function manager(){const rows=STAFF.map(x=>`<tr><td><b>${x[0]}</b></td><td>${x[1]}%</td><td>${x[2]}%</td><td>${x[3]}</td><td><span class="status ${x[1]<70||x[2]<55?'warn':''}">${x[4]}</span></td></tr>`).join('');app.innerHTML=`<section class="manager"><div class="kicker">Кабинет управляющего</div><h1>Кто действительно знает меню?</h1><p>Вместо «я вроде рассказывал стажёру» — конкретная картина по кухне, бару, тестам и слабым зонам каждого сотрудника.</p><div class="row"><button class="primary" onclick="toggleRole()">Посмотреть глазами официанта</button></div></section><section class="section"><div class="grid g3"><div class="card metric"><b>72%</b><span>Среднее знание кухни</span></div><div class="card metric"><b>59%</b><span>Среднее знание бара</span></div><div class="card metric"><b>2</b><span>Требуют внимания</span></div></div></section><section class="section"><div class="card" style="overflow:auto"><table><thead><tr><th>Сотрудник</th><th>Кухня</th><th>Бар</th><th>XP</th><th>Статус</th></tr></thead><tbody>${rows}</tbody></table></div></section><section class="section"><div class="grid g2"><div class="insight"><b>Бар проседает сильнее кухни</b>В первую очередь повторить вина и классические коктейли.</div><div class="insight"><b>Егор Фомин — зона риска</b>28% по бару. Перед самостоятельной сменой нужен повторный тест.</div><div class="insight"><b>Что уже хорошо</b>Закуски команда знает заметно лучше остальных категорий.</div><div class="insight"><b>Следующий слой продукта</b>Загрузка меню → автоматические карточки и тесты → проверка управляющим.</div></div></section>`}
render();
</script>
</body>
</html>
