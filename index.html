aste:'Горько-сладкий, цитрусовый',serve:'Рокс · крупный лёд',ingredients:'Джин, красный вермут, биттер',photo:''},{id:'b3',block:'Коктейли',name:'Whiskey Sour',price:'760 ₽',desc:'Баланс виски, лимона и мягкой сладости с воздушной текстурой.',volume:'120 мл',strength:'~18%',taste:'Кисло-сладкий, мягкий',serve:'Рокс · лёд',ingredients:'Виски, лимон, сахар, белок',photo:''},{id:'b4',block:'Крепкий алкоголь',name:'Bourbon',price:'590 ₽',desc:'Насыщенный американский виски с ванилью, карамелью и древесной нотой.',volume:'50 мл',strength:'40%',taste:'Ваниль, карамель, дуб',serve:'Рокс · чистым или со льдом',ingredients:'Бурбон',photo:''},{id:'b5',block:'Кофе / чай',name:'Фильтр-кофе',price:'280 ₽',desc:'Чистый, лёгкий кофе с выраженным ароматом зерна.',volume:'250 мл',strength:'—',taste:'Зависит от зерна',serve:'Керамическая чашка',ingredients:'Кофе, вода',photo:''},{id:'b6',block:'Безалкогольные напитки',name:'Домашний тоник',price:'390 ₽',desc:'Сухой освежающий напиток с лёгкой горчинкой и цитрусом.',volume:'300 мл',strength:'0%',taste:'Цитрус, горчинка',serve:'Хайбол · лёд',ingredients:'Тоник, цитрус',photo:''}]};

function teamAverage(){const xs=state.data.employees.filter(e=>e.active&&e.attestations?.length).map(e=>e.current.overall);return xs.length?Math.round(xs.reduce((a,b)=>a+b,0)/xs.length):0}

const App={go(route,arg){state.route=route;if(arg!==undefined)state.arg=arg;this.render();scrollTo({top:0,behavior:'instant'})},render(){document.getElementById('exitBtn').classList.toggle('hidden',state.route==='roles');document.getElementById('modeBadge').textContent=state.manager?'Управляющий':state.user?state.user.role:'Выбор роли';if(state.route==='roles')return renderRoles();if(state.route==='manager-login')return renderManagerLogin();if(state.route==='manager')return renderManager();if(state.route==='employee')return renderEmployeeDetail(state.selectedEmployee);if(state.route==='staff-select')return renderStaffSelect(state.role);if(state.route==='staff-login')return renderStaffLogin(state.selectedEmployee);if(state.route==='staff-home')return renderStaffHome();if(state.route==='menu')return renderMenu();if(state.route==='item')return renderItem(state.arg);if(state.route==='training')return renderTrainingPlaceholder()},logout(){state.manager=false;state.user=null;state.role=null;state.selectedEmployee=null;this.go('roles')},managerLogin(){const p=document.getElementById('managerPin').value;if(p===state.data.managerPin){state.manager=true;this.go('manager')}else showError('managerErr','Неверный PIN-код')},chooseRole(role){state.role=role;if(role==='Управляющий')this.go('manager-login');else this.go('staff-select')},selectStaff(id){state.selectedEmployee=id;this.go('staff-login')},staffLogin(){const e=getEmp(state.selectedEmployee),p=document.getElementById('staffPin').value;if(e&&p===e.pin){state.user=e;this.go('staff-home')}else showError('staffErr','Неверный PIN-код')},setFilter(f){state.filter=f;renderManager()},openEmployee(id){state.selectedEmployee=id;this.go('employee')},openMenu(type){state.menuType=type;state.menuBlock=null;this.go('menu')},setBlock(b){state.menuBlock=b;renderMenu()},openItem(id){this.go('item',id)},openAdd(){openEmployeeForm()},openEdit(id){openEmployeeForm(getEmp(id))},archive(id){const e=getEmp(id);if(!e)return;if(confirm(`Архивировать ${e.name}? История аттестаций сохранится.`)){e.active=false;Store.save();dlg.close();state.selectedEmployee=null;this.go('manager')}},restore(id){const e=getEmp(id);if(e){e.active=true;Store.save();renderManager()}},training(){this.go('training')}};
function getEmp(id){return state.data.employees.find(e=>e.id===id)}function showError(id,text){const x=document.getElementById(id);x.textContent=text;x.classList.remove('hidden')}
function renderRoles(){nav.classList.add('hidden');root.innerHTML=`<section class="role-hero"><div class="kicker">Главное меню</div><h1 class="title">Выберите<br>кабинет</h1><p class="subtitle">Три входа в одну систему. Управляющий контролирует команду и аттестации. Официант и бармен изучают кухню и бар и проходят тренировочные тесты.</p><div class="role-grid"><button class="role-card dark" onclick="App.chooseRole('Управляющий')"><span class="role-num">01</span><div><h2>Управляющий</h2><p>Команда, карточки сотрудников, аттестации и рейтинг.</p></div><span class="arrow">→</span></button><button class="role-card" onclick="App.chooseRole('Официант')"><span class="role-num">02</span><div><h2>Официант</h2><p>Кухня, бар, карточки позиций и тренировочные тесты.</p></div><span class="arrow">→</span></button><button class="role-card" onclick="App.chooseRole('Бармен')"><span class="role-num">03</span><div><h2>Бармен</h2><p>Бар, кухня, карточки позиций и тренировочные тесты.</p></div><span class="arrow">→</span></button></div></section>`}
function renderManagerLogin(){nav.classList.add('hidden');root.innerHTML=`<div class="login-wrap"><button class="back" onclick="App.go('roles')">← Главное меню</button><div class="panel pin-card"><div class="kicker">Управляющий</div><h1>PIN-код</h1><p class="subtitle">Вход в кабинет управляющего.</p><div class="field"><label>4 цифры</label><input id="managerPin" inputmode="numeric" maxlength="4" placeholder="••••" onkeydown="if(event.key==='Enter')App.managerLogin()"></div><div id="managerErr" class="error hidden"></div><div class="form-actions"><button class="primary" onclick="App.managerLogin()">Войти</button></div><div class="hint">Для демонстрации: 0000</div></div></div>`}
function managerNav(){nav.classList.remove('hidden');nav.innerHTML=navButton('manager','⌂','Команда')+`<button onclick="App.openAdd()"><b>＋</b>Добавить</button><button onclick="document.getElementById('archive')?.scrollIntoView({behavior:'smooth'})"><b>□</b>Архив</button><button onclick="App.go('roles')"><b>↩</b>Роли</button>`}
function renderManager(){managerNav();const avg=teamAverage(),active=state.data.employees.filter(e=>e.active),filtered=active.filter(e=>state.filter==='Все'||e.role===state.filter),archived=state.data.employees.filter(e=>!e.active);root.innerHTML=`<div class="page-head"><div><div class="kicker">Кабинет управляющего</div><h1>Команда</h1><p>Рейтинг строится из аттестаций. Тренировочные тесты его не меняют.</p></div></div><div class="layout manager-layout"><section class="panel dark"><div class="team-score"><div><div class="kicker" style="color:#999">Общий рейтинг команды</div><div class="big-score">${avg}%</div></div><div class="score-note">Сводный показатель по текущим аттестациям активной команды</div></div><div class="barline" style="margin-top:18px"><i style="width:${avg}%"></i></div></section><section class="panel"><h3>Сейчас в программе</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px"><div><div class="big-score" style="font-size:34px">${active.filter(e=>e.role==='Официант').length}</div><span class="muted">официантов</span></div><div><div class="big-score" style="font-size:34px">${active.filter(e=>e.role==='Бармен').length}</div><span class="muted">барменов</span></div></div></section><section class="panel full"><div class="manager-toolbar"><button class="chip ${state.filter==='Все'?'on':''}" onclick="App.setFilter('Все')">Все</button><button class="chip ${state.filter==='Официант'?'on':''}" onclick="App.setFilter('Официант')">Официанты</button><button class="chip ${state.filter==='Бармен'?'on':''}" onclick="App.setFilter('Бармен')">Бармены</button><span class="toolbar-spacer"></span><button class="primary" onclick="App.openAdd()">+ Добавить сотрудника</button></div><div class="staff-list">${filtered.length?filtered.map(staffCard).join(''):'<div class="empty">В этом разделе сотрудников нет.</div>'}</div></section><section class="panel full" id="archive"><div class="section-title" style="margin:0 0 10px"><div><h2>Архив</h2><p>История аттестаций архивированных сотрудников сохраняется.</p></div></div>${archived.length?archived.map(e=>`<div class="archive-row"><div><b>${esc(e.name)}</b><span>${esc(e.role)} · ${e.attestations?.length||0} аттестаций</span></div><button class="secondary" onclick="App.restore('${e.id}')">Вернуть</button></div>`).join(''):'<div class="empty">Архив пуст.</div>'}</section></div>`}
function staffCard(e){return `<button class="staff-card" onclick="App.openEmployee('${e.id}')"><span class="photo">${photoHTML(e)}</span><span><b>${esc(e.name)}</b><small>${esc(e.role)} · <a href="tel:${esc(e.phone.replace(/\s/g,''))}" onclick="event.stopPropagation()" style="color:inherit">${esc(e.phone)}</a></small><span class="mini-bars"><div>Кухня<i style="--v:${score(e.current.kitchen)}%"></i></div><div>Бар<i style="--v:${score(e.current.bar)}%"></i></div></span></span><span class="staff-rating"><strong>${score(e.current.overall)}%</strong><span>${e.attestations?.length||0} аттест.</span></span></button>`}
function renderEmployeeDetail(id){managerNav();const e=getEmp(id);if(!e)return App.go('manager');root.innerHTML=`<button class="back" onclick="App.go('manager')">← Команда</button><div class="page-head"><div><div class="kicker">Карточка сотрудника</div><h1>${esc(e.name)}</h1><p>${esc(e.role)} · <a href="tel:${esc(e.phone.replace(/\s/g,''))}" style="color:inherit">${esc(e.phone)}</a>${e.tg?` · @${esc(e.tg)}`:''}</p></div><button class="secondary" onclick="App.openEdit('${e.id}')">Редактировать</button></div><div class="layout manager-layout"><section class="panel"><div class="profile"><div class="photo">${photoHTML(e)}</div><div><h2>${esc(e.name)}</h2><p>Дата выхода: ${esc(e.start||'—')}</p></div><div class="profile-score"><strong>${score(e.current.overall)}%</strong><span>общий рейтинг</span></div></div><div class="scale-grid">${scaleRows(e)}</div><div class="notice" style="margin-top:14px"><b>Источник рейтинга — аттестации.</b> Тренировки и тренировочные тесты этот рейтинг не меняют. История ниже хранит несколько аттестаций.</div></section><section class="panel"><h2>История аттестаций</h2><p class="muted">Несколько аттестаций сотрудника сохраняются в его карточке.</p><div class="att-history">${(e.attestations||[]).map(a=>`<div class="att-row"><div><b>${esc(a.title)}</b><small>${esc(a.date)}</small></div><strong>${score(a.score)}%</strong></div>`).join('')||'<div class="empty">Пока нет аттестаций.</div>'}</div></section><section class="panel full"><div class="section-title" style="margin:0 0 10px"><div><h2>Кухня</h2><p>Блоки меню и текущая шкала знания сотрудника</p></div></div><div class="block-grid">${managerBlocks(e,'kitchen')}</div></section><section class="panel full"><div class="section-title" style="margin:0 0 10px"><div><h2>Бар</h2><p>Блоки меню и текущая шкала знания сотрудника</p></div></div><div class="block-grid">${managerBlocks(e,'bar')}</div></section><section class="panel full"><div class="form-actions"><button class="secondary" onclick="App.openEdit('${e.id}')">Изменить данные / PIN</button><button class="danger" onclick="App.archive('${e.id}')">Архивировать сотрудника</button></div></section></div>`}
function managerBlocks(e,type){const blocks=type==='kitchen'?KITCHEN_BLOCKS:BAR_BLOCKS,base=type==='kitchen'?e.current.kitchen:e.current.bar;return blocks.map((b)=>{const v=score(base);return `<div class="block"><div><h3>${b}</h3><p>Шкала знания блока сотрудником</p><div class="barline"><i style="width:${v}%"></i></div><div class="block-actions" style="margin-top:9px"><button class="smallbtn" onclick="openManagerTrainingInfo('${esc(b)}')">Тест</button><button class="smallbtn black" onclick="openAttestationInfo('${esc(b)}')">Аттестация</button></div></div><div class="block-score"><b>${v}%</b><small>${type==='kitchen'?'кухня':'бар'}</small></div></div>`}).join('')}
function openManagerTrainingInfo(block){modal.innerHTML=`<div class="modal-head"><div><div class="kicker">Тренировочный тест</div><h2>${block}</h2></div><button class="x" onclick="dlg.close()">×</button></div><div class="notice"><b>Тренировка рейтинг не меняет.</b><br>Как управляющий назначает тест, сколько в нём вопросов и как сотрудник его проходит — оставляем для отдельной проработки механики тестов.</div>`;dlg.showModal()}
function openAttestationInfo(block){modal.innerHTML=`<div class="modal-head"><div><div class="kicker">Аттестация</div><h2>${block}</h2></div><button class="x" onclick="dlg.close()">×</button></div><div class="notice"><b>Механику аттестации сейчас не придумываем.</b><br>Это отдельный главный блок продукта, который будем проектировать отдельно. Зафиксировано только правило: аттестации влияют на рейтинг, тренировочные тесты — нет; рейтинг хранит результаты нескольких аттестаций.</div>`;dlg.showModal()}
function openEmployeeForm(e=null){const isEdit=!!e,x=e||{name:'',role:'Официант',phone:'',tg:'',start:'',pin:'',photo:''};modal.innerHTML=`<div class="modal-head"><div><div class="kicker">${isEdit?'Управление сотрудником':'Новый сотрудник'}</div><h2>${isEdit?esc(x.name):'Добавить сотрудника'}</h2></div><button class="x" onclick="dlg.close()">×</button></div><div class="form-grid"><div class="field"><label>Имя Фамилия</label><input id="fName" value="${esc(x.name)}" autocomplete="off"></div><div class="field"><label>Должность</label><select id="fRole"><option ${x.role==='Официант'?'selected':''}>Официант</option><option ${x.role==='Бармен'?'selected':''}>Бармен</option></select></div><div class="field"><label>Телефон</label><input id="fPhone" value="${esc(x.phone)}" inputmode="tel" placeholder="+7 900 000-00-00"></div><div class="field"><label>ТГ / никнейм</label><input id="fTg" value="${esc(x.tg||'')}" placeholder="username"></div><div class="field"><label>Дата выхода</label><input id="fStart" type="date" value="${esc(x.start||'')}"></div><div class="field"><label>PIN-код · 4 цифры</label><input id="fPin" value="${esc(x.pin||'')}" maxlength="4" inputmode="numeric" placeholder="0000"></div><div class="field" style="grid-column:1/-1"><label>Фото</label><input id="fPhoto" type="file" accept="image/*"></div></div>${isEdit?`<div class="notice" style="margin-top:10px"><b>PIN сотрудника управляется здесь.</b> Управляющий может изменить или задать новый PIN из карточки сотрудника.</div>`:''}<div id="formErr" class="error hidden"></div><div class="form-actions"><button class="primary" onclick="saveEmployee('${isEdit?e.id:''}')">${isEdit?'Сохранить изменения':'Создать сотрудника'}</button>${isEdit?`<button class="secondary" onclick="document.getElementById('fPin').value='';document.getElementById('fPin').focus()">Задать новый PIN</button>`:''}<button class="secondary" onclick="dlg.close()">Назад</button></div>`;dlg.showModal()}
async function saveEmployee(id){const name=document.getElementById('fName').value.trim(),role=document.getElementById('fRole').value,phone=document.getElementById('fPhone').value.trim(),tg=document.getElementById('fTg').value.trim().replace(/^@/,''),start=document.getElementById('fStart').value,pin=document.getElementById('fPin').value.trim(),file=document.getElementById('fPhoto').files[0];if(!name||!/^[0-9]{4}$/.test(pin)){showError('formErr','Нужно заполнить имя и PIN из 4 цифр.');return}let photo=id?getEmp(id)?.photo||'':'';if(file)photo=await fileToData(file);if(id){Object.assign(getEmp(id),{name,role,phone,tg,start,pin,photo})}else{state.data.employees.push({id:'e'+Date.now(),name,role,phone,tg,start,pin,photo,active:true,current:{overall:0,scales:[0,0,0,0,0],kitchen:0,bar:0},attestations:[]})}Store.save();dlg.close();if(id){state.selectedEmployee=id;App.go('employee')}else App.go('manager')}
function fileToData(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
function renderStaffSelect(role){nav.classList.add('hidden');const xs=state.data.employees.filter(e=>e.active&&e.role===role);root.innerHTML=`<button class="back" onclick="App.go('roles')">← Главное меню</button><div class="page-head"><div><div class="kicker">${role}</div><h1>Выберите себя</h1><p>После выбора — вход через свой PIN-код.</p></div></div><div class="staff-list">${xs.map(e=>staffCardSelect(e)).join('')||'<div class="empty">Нет зарегистрированных сотрудников этой должности.</div>'}</div>`}
function staffCardSelect(e){return `<button class="staff-card" onclick="App.selectStaff('${e.id}')"><span class="photo">${photoHTML(e)}</span><span><b>${esc(e.name)}</b><small>${esc(e.role)}</small></span><span class="staff-rating"><strong>${score(e.current.overall)}%</strong><span>рейтинг</span></span></button>`}
function renderStaffLogin(id){nav.classList.add('hidden');const e=getEmp(id);if(!e)return App.go('roles');root.innerHTML=`<div class="login-wrap"><button class="back" onclick="App.go('staff-select')">← Выбрать сотрудника</button><div class="panel pin-card"><div class="profile"><div class="photo">${photoHTML(e)}</div><div><h2>${esc(e.name)}</h2><p>${esc(e.role)}</p></div></div><div class="field"><label>Ваш PIN-код</label><input id="staffPin" inputmode="numeric" maxlength="4" placeholder="••••" onkeydown="if(event.key==='Enter')App.staffLogin()"></div><div id="staffErr" class="error hidden"></div><div class="form-actions"><button class="primary" onclick="App.staffLogin()">Войти</button></div><div class="hint">Для демо: ${esc(e.pin)}</div></div></div>`}
function staffNav(){nav.classList.remove('hidden');nav.innerHTML=navButton('staff-home','⌂','Кабинет')+`<button class="${state.route==='menu'&&state.menuType==='kitchen'?'on':''}" onclick="App.openMenu('kitchen')"><b>◫</b>Кухня</button><button class="${state.route==='menu'&&state.menuType==='bar'?'on':''}" onclick="App.openMenu('bar')"><b>◒</b>Бар</button><button onclick="App.go('roles')"><b>↩</b>Роли</button>`}
function renderStaffHome(){staffNav();const e=state.user;if(!e)return App.go('roles');const primary=e.role==='Бармен'?'bar':'kitchen';root.innerHTML=`<div class="page-head"><div><div class="kicker">Кабинет ${e.role.toLowerCase()}</div><h1>${esc(e.name)}</h1><p>Меню для изучения и ваш текущий рейтинг по аттестациям.</p></div></div><div class="layout manager-layout"><section class="panel"><div class="profile"><div class="photo">${photoHTML(e)}</div><div><h2>${esc(e.name)}</h2><p>${esc(e.role)}</p></div><div class="profile-score"><strong>${score(e.current.overall)}%</strong><span>мой рейтинг</span></div></div><div class="scale-grid">${scaleRows(e)}</div></section><section class="panel dark"><div class="kicker" style="color:#999">Главное для изучения</div><h2 style="font-size:28px;margin-top:8px">${primary==='bar'?'Бар':'Кухня'}</h2><p class="muted">Открывайте блоки меню, изучайте позиции и запускайте тренировочные тесты.</p><button class="secondary" style="margin-top:14px" onclick="App.openMenu('${primary}')">Открыть ${primary==='bar'?'бар':'кухню'} →</button></section></div><div class="section-title"><div><h2>Разделы</h2><p>Официант и бармен видят и кухню, и бар</p></div></div><div class="role-grid" style="margin-top:0"><button class="role-card" style="min-height:180px" onclick="App.openMenu('kitchen')"><span class="role-num">КУХНЯ · ${score(e.current.kitchen)}%</span><div><h2>Кухня</h2><p>Блюда, описание, вес, состав и тесты.</p></div><span class="arrow">→</span></button><button class="role-card" style="min-height:180px" onclick="App.openMenu('bar')"><span class="role-num">БАР · ${score(e.current.bar)}%</span><div><h2>Бар</h2><p>Напитки, объём, крепость, вкус, подача и тесты.</p></div><span class="arrow">→</span></button></div>`}
function renderMenu(){staffNav();const type=state.menuType,blocks=type==='kitchen'?KITCHEN_BLOCKS:BAR_BLOCKS,items=DEMO_MENU[type],block=state.menuBlock||blocks[0],visible=items.filter(x=>x.block===block);root.innerHTML=`<button class="back" onclick="App.go('staff-home')">← Кабинет</button><div class="page-head"><div><div class="kicker">${type==='kitchen'?'Кухня':'Бар'}</div><h1>${type==='kitchen'?'Меню кухни':'Меню бара'}</h1><p>${type==='kitchen'?'Изучение блюд по блокам.':'Изучение напитков по блокам.'}</p></div><button class="secondary" onclick="App.training()">Тест по всему ${type==='kitchen'?'меню кухни':'бару'}</button></div><div class="menu-tabs">${blocks.map(b=>`<button class="menu-tab ${b===block?'on':''}" onclick="App.setBlock('${esc(b)}')">${esc(b)}</button>`).join('')}</div><div class="menu-grid">${visible.length?visible.map(menuCard).join(''):`<div class="empty">Демо-позиции для блока «${esc(block)}» пока не заполнены.</div>`}</div><div class="form-actions" style="margin-top:12px"><button class="secondary" onclick="App.training()">Пройти тренировочный тест по блоку</button></div>`}
function menuCard(x){return `<button class="menu-card" onclick="App.openItem('${x.id}')"><div class="dish-photo">${x.photo?`<img src="${x.photo}">`:''}<span class="photo-label">ФОТО ПОЗИЦИИ</span></div><div class="dish-body"><div class="dish-top"><h3>${esc(x.name)}</h3><span class="price">${esc(x.price)}</span></div><p class="dish-desc">${esc(x.desc)}</p></div></button>`}
function findItem(id){return [...DEMO_MENU.kitchen,...DEMO_MENU.bar].find(x=>x.id===id)}
function renderItem(id){staffNav();const x=findItem(id);if(!x)return App.go('menu');const isBar=!!x.volume;root.innerHTML=`<button class="back" onclick="App.go('menu')">← ${esc(x.block)}</button><div class="page-head"><div><div class="kicker">${isBar?'Бар':'Кухня'} · ${esc(x.block)}</div><h1>${esc(x.name)}</h1><p>${esc(x.price)}</p></div></div><div class="detail-shell"><div class="detail-photo">${x.photo?`<img src="${x.photo}">`:''}<span class="photo-label">ФОТО ПОЗИЦИИ</span></div><section class="panel"><h2>${esc(x.name)}</h2><p class="subtitle" style="margin-top:7px">${esc(x.desc)}</p><div class="detail-grid">${isBar?`<div class="fact"><span>Объём</span><b>${esc(x.volume)}</b></div><div class="fact"><span>Крепость</span><b>${esc(x.strength)}</b></div><div class="fact"><span>Вкус</span><b>${esc(x.taste)}</b></div><div class="fact"><span>Подача / бокал</span><b>${esc(x.serve)}</b></div>`:`<div class="fact"><span>Вес</span><b>${esc(x.weight)}</b></div><div class="fact"><span>Цена</span><b>${esc(x.price)}</b></div>`}<div class="fact wide"><span>Основной состав</span><b>${esc(x.ingredients)}</b></div></div><div class="detail-actions"><button class="primary" onclick="App.training()">Пройти тест по ${isBar?'позиции':'блюду'}</button><button class="secondary" onclick="App.go('menu')">Назад</button></div></section></div>`}
function renderTrainingPlaceholder(){staffNav();root.innerHTML=`<button class="back" onclick="App.go('menu')">← Назад</button><div class="login-wrap" style="margin-top:4vh"><div class="panel"><div class="kicker">Тренировочный тест</div><h1 style="font-size:31px;letter-spacing:-.04em;margin:6px 0">Механику делаем отдельно</h1><p class="subtitle">Этот экран специально пока не заполнен выдуманными правилами.</p><div class="notice" style="margin-top:16px"><b>Зафиксировано одно:</b><br>тренировочные тесты нужны для обучения и занятия сотрудника. Они не изменяют рейтинг. Механика вопросов, повторов, ошибок и аттестации будет отдельным продуктовым блоком.</div><div class="form-actions"><button class="primary" onclick="App.go('menu')">Вернуться к меню</button></div></div></div>`}
App.render();
</script>
